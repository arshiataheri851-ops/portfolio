name: Docker Compose smoke tests

on:
  push:
    paths:
      - "routepilot/**"
      - "signaldesk/**"
      - ".github/workflows/compose-smoke.yml"
  pull_request:
    paths:
      - "routepilot/**"
      - "signaldesk/**"
      - ".github/workflows/compose-smoke.yml"
  workflow_dispatch:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: RoutePilot
            directory: routepilot
            port: 8000
            resource: deliveries
          - product: SignalDesk
            directory: signaldesk
            port: 8001
            resource: tickets
    name: ${{ matrix.product }} Docker smoke test
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard JavaScript syntax
        run: node --check app.js
      - name: Create isolated demo environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=demo
          POSTGRES_PASSWORD=ci-demo-password-123456
          AUTH_JWT_SECRET=ci-only-secret-that-is-at-least-32-bytes-long
          BOOTSTRAP_ORG_NAME=CI Demo Org
          BOOTSTRAP_ADMIN_EMAIL=admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD=CI-demo-password-123456
          ROUTEPILOT_CORS_ORIGINS=http://127.0.0.1:5500
          SIGNALDESK_CORS_ORIGINS=http://127.0.0.1:5500
          EOF
      - name: Build and start full Compose stack
        run: docker compose up --build -d
      - name: Wait for API readiness
        env:
          PORT: ${{ matrix.port }}
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:$PORT/ready"; then
              echo
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify bootstrap login and authenticated data access
        env:
          PORT: ${{ matrix.port }}
          RESOURCE: ${{ matrix.resource }}
        run: |
          set -e
          response=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"organization_name":"CI Demo Org","email":"admin@example.test","password":"CI-demo-password-123456"}' \
            "http://127.0.0.1:$PORT/auth/login")
          token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$response")
          test -n "$token"
          if ! curl --fail --silent --show-error -H "Authorization: Bearer $token" "http://127.0.0.1:$PORT/auth/me"; then
            docker compose logs --no-color
            exit 1
          fi
          echo
          if ! curl --fail --silent --show-error -H "Authorization: Bearer $token" "http://127.0.0.1:$PORT/$RESOURCE"; then
            docker compose logs --no-color
            exit 1
          fi
          echo
      - name: Stop stack
        if: always()
        run: docker compose down -v
