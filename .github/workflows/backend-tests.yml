name: Backend tests

on:
  push:
    paths:
      - "routepilot/backend/**"
      - "signaldesk/backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "routepilot/backend/**"
      - "signaldesk/backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: RoutePilot
            directory: routepilot/backend
          - product: SignalDesk
            directory: signaldesk/backend
    name: ${{ matrix.product }} tests
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        env:
          DATABASE_URL: sqlite:///./migration-test.db
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest -q
