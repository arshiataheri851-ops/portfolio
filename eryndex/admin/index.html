<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Request administration | ERYNDEX</title><link rel="stylesheet" href="../assets/style.css"><style>.wrap{max-width:1100px;margin:8vh auto;padding:24px}.field{padding:10px;background:#101827;border:1px solid #34435b;color:white;border-radius:7px;width:100%;margin:6px 0 14px}.request{border:1px solid #34435b;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.small{color:#aab6ca}textarea.field{min-height:90px}</style></head><body><header class="header"><a class="logo" href="../">ERYNDEX<span class="logo-period">.</span></a></header><main class="wrap"><div class="section-label">PRIVATE · ADMIN</div><h1>Collaboration requests</h1><p class="small">This dashboard requires the private admin API token. Never share it or enter it on a public/shared device.</p><label>Admin API token</label><input class="field" id="token" type="password" autocomplete="off"><button class="btn btn-primary" id="load">Load requests</button><p id="status" role="status" class="small"></p><div id="requests"></div></main><script src="../assets/config.js"></script><script>
const token=document.getElementById("token"),status=document.getElementById("status"),root=document.getElementById("requests"),endpoint=()=>((window.ERYNDEX_CONTACT_ENDPOINT||"").replace("/api/requests",""));
document.getElementById("load").onclick=load;
async function api(path,options={}){const r=await fetch(endpoint()+path,{...options,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token.value,...options.headers}});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
async function load(){if(!endpoint()){status.textContent="Configure the API endpoint after deployment.";return;}status.textContent="Loading…";try{const d=await api("/api/admin/requests");root.innerHTML=d.requests.map(card).join("")||"<p>No requests yet.</p>";status.textContent=d.requests.length+" requests";root.querySelectorAll("form[data-id]").forEach(f=>f.onsubmit=save);}catch(e){status.textContent=e.message;}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function card(x){return '<article class="request"><div class="small">'+esc(x.reference)+' · '+esc(x.created_at)+'</div><h2>'+esc(x.name)+' — '+esc(x.service)+'</h2><p>'+esc(x.email)+' · '+esc(x.company)+'</p><p>'+esc(x.message)+'</p><form data-id="'+esc(x.id)+'"><div class="grid"><label>Status<select class="field" name="status">'+["submitted","under_review","needs_information","proposal_sent","awaiting_approval","approved","in_progress","completed","declined"].map(s=>'<option '+(s===x.status?'selected':'')+'>'+s+'</option>').join("")+'</select></label><label>Priority<select class="field" name="priority">'+["low","normal","high"].map(s=>'<option '+(s===x.priority?'selected':'')+'>'+s+'</option>').join("")+'</select></label><label>Proposal amount<input class="field" name="proposal_amount" value="'+esc(x.proposal_amount)+'"></label><label>Timeline<input class="field" name="proposal_timeline" value="'+esc(x.proposal_timeline)+'"></label></div><label>Internal note<textarea class="field" name="admin_note">'+esc(x.admin_note)+'</textarea></label><label>Customer-visible update<input class="field" name="public_message" placeholder="Message shown in customer tracking history"></label><button class="btn btn-primary">Save update</button></form></article>';}
async function save(e){e.preventDefault();const f=e.currentTarget;try{await api("/api/admin/requests/"+f.dataset.id,{method:"PATCH",body:JSON.stringify(Object.fromEntries(new FormData(f)))});status.textContent="Saved.";await load();}catch(err){status.textContent=err.message;}}
</script></body></html>
