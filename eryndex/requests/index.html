<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Track a request | ERYNDEX</title><link rel="stylesheet" href="../assets/style.css"><style>.portal{max-width:760px;margin:12vh auto;padding:32px}.portal input{display:block;width:100%;margin:8px 0 20px;padding:14px;background:#101827;border:1px solid #34435b;border-radius:8px;color:white}.portal button{padding:13px 22px;cursor:pointer}.result{margin-top:28px;padding:22px;border:1px solid #34435b;border-radius:12px}.muted{color:#aab6ca}.event{padding:12px 0;border-bottom:1px solid #26344a}</style></head><body><header class="header"><a class="logo" href="../">ERYNDEX<span class="logo-period">.</span></a><nav><a href="../">Home</a><a href="../fa/requests/">فارسی</a></nav></header><main class="portal"><div class="section-label">CUSTOMER PORTAL</div><h1>Track your collaboration request</h1><p class="muted">Enter the reference number from your submission confirmation and the same email address used in the request.</p><form id="trackForm"><label for="reference">Request reference</label><input id="reference" name="reference" placeholder="ERX-2026-XXXXXXXX" required maxlength="32"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"><button class="btn btn-primary" type="submit">Find my request ↗</button></form><p id="status" role="status" aria-live="polite" class="muted"></p><section id="result" class="result" hidden></section></main><script src="../assets/config.js"></script><script>
const form=document.getElementById("trackForm"),status=document.getElementById("status"),result=document.getElementById("result");
form.addEventListener("submit",async e=>{e.preventDefault();result.hidden=true;const endpoint=window.ERYNDEX_CONTACT_ENDPOINT||"";if(!endpoint){status.textContent="Online tracking will be available after the secure service is deployed.";return;}status.textContent="Looking up your request…";try{const r=await fetch(endpoint.replace(/\\/api\\/requests$/,"")+"/api/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok)throw Error(d.error||"Lookup failed");const x=d.request;result.hidden=false;result.innerHTML="<h2>"+x.reference+"</h2><p><strong>"+x.statusLabel+"</strong></p><p class='muted'>Service: "+escapeHtml(x.service)+" · Updated: "+new Date(x.updated_at).toLocaleString()+"</p><h3>Activity</h3>"+x.history.map(v=>"<div class='event'><b>"+escapeHtml(v.status.replaceAll("_"," "))+"</b><p>"+escapeHtml(v.public_message)+"</p><small class='muted'>"+new Date(v.created_at).toLocaleString()+"</small></div>").join("");status.textContent="";}catch(err){status.textContent=err.message;}});function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script></body></html>
